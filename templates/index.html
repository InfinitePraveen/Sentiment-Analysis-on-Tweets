<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis on Tweets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🐦 Tweet Sentiment Analyzer</h1>
                <p class="subtitle">Analyze the sentiment of any tweet in real-time</p>
            </div>
        </header>

        <main>
            <div class="input-section">
                <div class="input-wrapper">
                    <textarea id="tweet-input" placeholder="Enter a tweet to analyze..." rows="4"></textarea>
                    <div class="char-counter">
                        <span id="char-count">0</span> / 280 characters
                    </div>
                </div>
                <button id="analyze-btn" class="btn-primary">
                    <span class="btn-icon">🔍</span> Analyze Sentiment
                </button>
            </div>

            <div id="result-section" class="result-section hidden">
                <div class="sentiment-result">
                    <div id="sentiment-icon" class="sentiment-icon">😊</div>
                    <div class="sentiment-info">
                        <h2 id="sentiment-label">Positive</h2>
                        <div class="confidence-bar-container">
                            <div class="confidence-bar">
                                <div id="confidence-fill" class="confidence-fill" style="width: 0%"></div>
                            </div>
                            <span id="confidence-text" class="confidence-text">0%</span>
                        </div>
                    </div>
                </div>

                <div class="probability-section">
                    <h3>Probability Distribution</h3>
                    <div class="probability-bars">
                        <div class="prob-item">
                            <span class="prob-label">Negative</span>
                            <div class="prob-bar-container">
                                <div id="prob-negative" class="prob-bar negative" style="width: 0%"></div>
                            </div>
                            <span id="prob-negative-text" class="prob-value">0%</span>
                        </div>
                        <div class="prob-item">
                            <span class="prob-label">Neutral</span>
                            <div class="prob-bar-container">
                                <div id="prob-neutral" class="prob-bar neutral" style="width: 0%"></div>
                            </div>
                            <span id="prob-neutral-text" class="prob-value">0%</span>
                        </div>
                        <div class="prob-item">
                            <span class="prob-label">Positive</span>
                            <div class="prob-bar-container">
                                <div id="prob-positive" class="prob-bar positive" style="width: 0%"></div>
                            </div>
                            <span id="prob-positive-text" class="prob-value">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="history-section" class="history-section hidden">
                <h3>📊 Recent Predictions</h3>
                <div id="history-list" class="history-list">
                    <!-- History items will be inserted here -->
                </div>
            </div>
        </main>

        <footer>
            <p>Built with ❤️ using NLTK, Scikit-learn & Flask</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
